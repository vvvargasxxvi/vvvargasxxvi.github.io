<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram DM Generator - Ultimate GUI</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'SF Pro Display';
            src: local('-apple-system'), local('BlinkMacSystemFont');
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #121212; display: flex; justify-content: center; gap: 20px; padding: 20px; height: 100vh; color: #fff;
        }

        .controls { 
            background: #1e1e1e; border-radius: 16px; padding: 20px; width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            display: flex; flex-direction: column; gap: 12px; height: fit-content; max-height: 95vh; overflow-y: auto; border: 1px solid #333;
        }
        .controls h3 { font-size: 18px; margin-bottom: 5px; text-align: center; }
        
        .control-section { background: #2a2a2a; border-radius: 8px; border: 1px solid #444; overflow: hidden; }
        .control-section summary { 
            padding: 12px; font-weight: 600; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; background: #333; transition: background 0.2s;
        }
        .control-section summary:hover { background: #3a3a3a; }
        .control-section summary::-webkit-details-marker { display: none; }
        .control-section summary::after { content: '▼'; font-size: 10px; transition: transform 0.3s ease; }
        .control-section[open] summary::after { transform: rotate(180deg); }
        .control-section[open] summary { border-bottom: 1px solid #444; }
        
        .section-content { padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
        .controls input[type="text"], .controls input[type="number"], .controls select, .controls textarea { 
            padding: 10px; border: 1px solid #444; background: #1e1e1e; color: #fff; border-radius: 8px; font-size: 14px; outline: none; width: 100%;
        }
        .controls button { background: #0095f6; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .controls button:hover { opacity: 0.8; }
        
        .reply-indicator { display: none; background: #262626; padding: 10px; border-radius: 8px; font-size: 12px; border-left: 3px solid #0095f6; color: #a8a8a8; }
        .reply-indicator-text { color: #fff; font-style: italic; display: block; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .cancel-btn { background: none !important; color: #ff4d4d !important; padding: 0 !important; float: right; width: auto !important; font-weight: bold;}

        .phone-wrapper { width: 400px; height: 850px; background: #0d1015; border-radius: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #222; position: relative; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: transparent; min-height: 0; }
        .top-bar-container { width: 100%; position: relative; background: #0d1015; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .top-bar-container img { width: 100%; display: block; }
        .dynamic-header { position: absolute; top: 57px; left: 45px; display: flex; align-items: center; gap: 10px; z-index: 10; }
        .dynamic-header img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid #222; }
        .header-info { display: flex; flex-direction: column; }
        .header-info .name { font-weight: 600; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 4px; }
        .header-info .subtitle { font-size: 12px; color: #8e8e8e; }
        #iosTimeDisplay { position: absolute; top: 14px; left: 32px; font-weight: 600; font-size: 16px; letter-spacing: -0.3px; color: #fff; z-index: 20; }

        .messages { flex: 1; padding: 16px; display: flex; flex-direction: column; overflow-y: auto; background: #0d1015; min-height: 0; position: relative; }
        .messages::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; cursor: pointer; transition: opacity 0.2s; position: relative; z-index: 2; }
        .message-row:hover { opacity: 0.8; }
        .message-row.left { align-self: flex-start; }
        .message-row.right { align-self: flex-end; }
        
        /* ПЛАШКА ВРЕМЕНИ */
        .time-divider {
            text-align: center;
            color: #8e8e8e;
            font-size: 11px;
            font-weight: 500;
            margin: 24px 0 16px 0;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            align-self: center;
        }

        .msg-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; visibility: hidden; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; max-width: 100%; min-width: 0; }
        .message-row.left .msg-content { align-items: flex-start; }
        .message-row.right .msg-content { align-items: flex-end; }

        .reply-header { font-size: 11px; color: #8e8e8e; margin-bottom: 4px; padding: 0 4px; }
        .reply-wrapper { display: flex; gap: 6px; margin-bottom: 6px; max-width: 100%; }
        .reply-line { width: 3px; background-color: #23282F; border-radius: 3px; flex-shrink: 0; }
        .reply-bubble { background: #23282F; padding: 10px 14px; border-radius: 18px; flex: 1; min-width: 0; }
        .reply-bubble-text { font-size: 13px; color: #e0e0e0; line-height: 1.2; max-height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; text-overflow: ellipsis; }
        .story-thumbnail { height: 200px; width: auto; max-width: 120px; object-fit: cover; border-radius: 12px; border: 1px solid #222; }

       .msg { padding: 9px 13px; border-radius: 20px; font-size: 15px; line-height: 1.35; overflow-wrap: break-word; word-break: break-word; width: fit-content; max-width: 100%; background-repeat: no-repeat; display: inline-block; }
        .message-row.left .msg { background: #25282d !important; color: #fff; }
        .message-row.right .msg { color: white; }
        .msg-image-attachment { max-width: 170px; border-radius: 20px !important; padding: 0; display: block; border: 1px solid #222; object-fit: cover; background: transparent !important; }

        .bottom-bar-container { width: 100%; background: #0d1015; flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
        .bottom-bar-container img { width: 100%; display: block; }
        .context-menu { position: absolute; background: #262626; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; border: 1px solid #363636; width: 160px; display: none; }
        .menu-item { padding: 12px 16px; font-size: 15px; color: #fff; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #363636; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: #333; }
        .menu-item-danger { color: #ed4956; }

        /* СТИЛИ ДЛЯ БОКОВОГО МЕНЮ */
        .sidebar { 
            background: #1e1e1e; 
            border-radius: 16px; 
            padding: 20px; 
            width: 220px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 1px solid #333;
            height: fit-content;
        }
        .sidebar-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }
        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }
        .nav-item:hover { 
            background: #2a2a2a; 
            border-color: #444;
        }
        .nav-item.active { 
            background: #0095f6; 
            color: #fff; 
            border-color: #0095f6;
            box-shadow: 0 4px 10px rgba(0, 149, 246, 0.3);
        }
        
    </style>
</head>
<body>

    <div class="controls">
        <h3>Настройки скрина</h3>

        <details class="control-section">
            <summary>📚 Библиотека персонажей</summary>
            <div class="section-content">
                <select id="characterSelect" style="font-weight: bold;" onchange="loadCharacter()">
                    <option value="">-- Новый персонаж --</option>
                </select>
                <div style="display: flex; gap: 5px;">
                    <button onclick="saveCharacter()" style="flex: 1; background: #4CAF50; font-size: 12px; padding: 6px;">💾 Сохранить</button>
                    <button onclick="deleteCharacter()" style="flex: 1; background: #ed4956; font-size: 12px; padding: 6px;">🗑️ Удалить</button>
                </div>
            </div>
        </details>
        
        <details class="control-section" open>
            <summary>👤 Профиль и Время</summary>
            <div class="section-content">
                <div>
                    <span style="font-size: 12px; color: #aaa; margin-bottom: 4px; display: block;">Ссылка на аватарку (URL) или файл:</span>
                    <input type="text" id="leftAvatar" placeholder="URL картинки" value="https://i.postimg.cc/Vvbh1Vy7/i.webp" style="margin-bottom: 5px;">
                    <input type="file" id="avatarUpload" accept="image/*" style="font-size: 12px; background: transparent; padding: 0; border: none;">
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="timeInput" value="14:38" placeholder="Время" style="flex: 1;">
                    <input type="text" id="leftName" placeholder="Имя" value="Введите имя..." style="flex: 2;">
                </div>
                <input type="text" id="leftSubtitle" placeholder="Подпись (В сети...)" value="">
                
                <button onclick="document.getElementById('advancedCoords').style.display='flex'; this.style.display='none';" style="background: none; color: #888; font-size: 11px; text-decoration: underline; padding: 0; text-align: left; width: fit-content;">Тонкая настройка координат</button>
                <div style="display: flex; gap: 10px; display: none;" id="advancedCoords">
                    <input type="number" id="timePosY" value="14" title="Позиция времени Y" oninput="updateTimePos()">
                    <input type="number" id="timePosX" value="32" title="Позиция времени X" oninput="updateTimePos()">
                    <input type="number" id="headerPosY" value="57" title="Позиция шапки Y" oninput="updateHeaderPos()">
                    <input type="number" id="headerPosX" value="45" title="Позиция шапки X" oninput="updateHeaderPos()">
                </div>
            </div>
        </details>

        <details class="control-section">
            <summary>📎 Прикрепить медиа</summary>
            <div class="section-content">
                <div id="storyUploadBlock" style="padding-bottom: 10px; border-bottom: 1px dashed #444;">
                    <strong>📱 Ответить на историю:</strong>
                    <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
                        <input type="file" id="storyUpload" accept="image/*" style="font-size: 12px; flex: 1; background: transparent; padding: 0; border: none;">
                        <button id="cancelStoryBtn" onclick="cancelStory()" style="display:none; background: #333; padding: 5px 10px; font-size: 12px;">Удалить</button>
                    </div>
                    <img id="storyPreview" style="display:none; height: 60px; border-radius: 6px; margin-top: 8px; border: 1px solid #444;">
                </div>

                <div id="imageUploadBlock">
                    <strong>🖼️ Отправить картинку в чат:</strong>
                    <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
                        <input type="file" id="imageAttachUpload" accept="image/*" style="font-size: 12px; flex: 1; background: transparent; padding: 0; border: none;">
                        <button id="cancelAttachedImageBtn" onclick="cancelAttachedImage()" style="display:none; background: #333; padding: 5px 10px; font-size: 12px;">Удалить</button>
                    </div>
                    <img id="attachedImagePreview" style="display:none; height: 80px; border-radius: 6px; margin-top: 8px; border: 1px solid #444; object-fit: cover;">
                </div>
            </div>
        </details>

        <hr style="border: 0; border-top: 1px solid #444; margin: 4px 0;">
        
        <!-- НОВЫЙ БЛОК: ПЛАШКА ВРЕМЕНИ -->
        <div style="display: flex; gap: 10px; margin-bottom: 5px;">
            <input type="text" id="timeDividerInput" placeholder="ВЧЕРА В 17:17" style="flex: 2;">
            <button onclick="addTimeDivider()" style="flex: 1; background: #333; font-size: 12px;">⏳ Плашка</button>
        </div>

        <div id="replyIndicator" class="reply-indicator">
            <button class="cancel-btn" onclick="cancelReply()">✕</button>
            Отвечаем на: <span id="replyPreview" class="reply-indicator-text"></span>
        </div>

        <textarea id="messageInput" placeholder="Текст сообщения..." rows="3" style="font-family: inherit; resize: none;"></textarea>
        <select id="senderSelect">
            <option value="right">От тебя (Градиент)</option>
            <option value="left">От собеседника (Темно-серый)</option>
        </select>
        
        <button id="mainActionBtn" onclick="addMessage()">Добавить сообщение</button>
        <div style="display: flex; gap: 10px;">
            <button onclick="clearChat()" style="background: #333; flex: 1; font-size: 13px;">Очистить чат</button>
            <button onclick="downloadChat()" style="background: #fff; color: #000; flex: 2; font-size: 13px;">📸 Скачать скрин</button>
        </div>
    </div>

    <div class="phone-wrapper" id="captureArea">
        <div id="contextMenu" class="context-menu">
            <div class="menu-item" onclick="handleReply()">Ответить</div>
            <div class="menu-item" onclick="handleEdit()">Изменить</div>
            <div class="menu-item menu-item-danger" onclick="handleDelete()">Удалить</div>
        </div>

        <div class="chat-container">
            <div class="top-bar-container">
                <img id="topBarImg" src="https://i.postimg.cc/CLHkRs4K/верхний_бар.png" alt="top bar" crossorigin="anonymous">
                <div id="iosTimeDisplay">14:38</div>
                <div class="dynamic-header" id="dynamicHeader">
                    <img id="headerAvatar" src="https://i.postimg.cc/Vvbh1Vy7/i.webp" alt="avatar">
                    <div class="header-info">
                        <div class="name">
                            <span id="headerName">Введите имя...</span>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8A8A8" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
                        </div>
                        <div class="subtitle" id="headerSubtitle"></div>
                    </div>
                </div>
            </div>
            <div class="messages" id="messagesBox"></div>
            <div class="bottom-bar-container">
                <img id="bottomBarImg" src="https://i.postimg.cc/SK5zBTm1/нижний_бар.png" alt="bottom bar" crossorigin="anonymous">
            </div>
        </div>
    </div>

    <script>
        const leftNameInput = document.getElementById('leftName');
        const leftSubtitleInput = document.getElementById('leftSubtitle');
        const timeInput = document.getElementById('timeInput');
        const iosTimeDisplay = document.getElementById('iosTimeDisplay');
        const leftAvatarInput = document.getElementById('leftAvatar');
        const messageInput = document.getElementById('messageInput');
        const senderSelect = document.getElementById('senderSelect');
        const messagesBox = document.getElementById('messagesBox');
        const contextMenu = document.getElementById('contextMenu');
        const mainActionBtn = document.getElementById('mainActionBtn');
        const phoneWrapper = document.getElementById('captureArea');
        const replyIndicator = document.getElementById('replyIndicator');
        const replyPreview = document.getElementById('replyPreview');
        const storyUploadBlock = document.getElementById('storyUploadBlock');
        const storyPreview = document.getElementById('storyPreview');
        const cancelStoryBtn = document.getElementById('cancelStoryBtn');
        const dynamicHeader = document.getElementById('dynamicHeader');
        const characterSelect = document.getElementById('characterSelect');
        
        let currentGradientBg = "url('https://i.postimg.cc/T1nmqVM4/фон-градиент.png')"; 
        let currentAvatarSrc = leftAvatarInput.value;
        let selectedMsgRow = null; 
        let editingMsgNode = null;
        let replyingToText = null; 
        let currentStorySrc = null;
        let currentAttachedImageSrc = null;

        const defaultCharacters = {
            "Hermione Granger": { avatar: "https://i.pravatar.cc/150?img=47", subtitle: "В сети" },
            "Theodore Nott": { avatar: "https://i.pravatar.cc/150?img=11", subtitle: "Был(а) недавно" },
            "Джинни": { avatar: "https://i.pravatar.cc/150?img=35", subtitle: "В сети" },
            "Astarion": { avatar: "https://i.pravatar.cc/150?img=68", subtitle: "В сети" },
            "Minthara": { avatar: "https://i.pravatar.cc/150?img=44", subtitle: "Не беспокоить" }
        };

        let savedCharacters = JSON.parse(localStorage.getItem('ig_dm_characters_v1')) || defaultCharacters;

        function updateCharDropdown() {
            characterSelect.innerHTML = '<option value="">-- Выбери или создай --</option>';
            for (let name in savedCharacters) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                characterSelect.appendChild(opt);
            }
        }

        function loadCharacter() {
            const name = characterSelect.value;
            if (!name) return; 
            const char = savedCharacters[name];
            leftNameInput.value = name;
            leftSubtitleInput.value = char.subtitle;
            leftAvatarInput.value = char.avatar;
            currentAvatarSrc = char.avatar;
            document.getElementById('headerName').textContent = name;
            document.getElementById('headerSubtitle').textContent = char.subtitle;
            updateAllAvatars();
        }

        function saveCharacter() {
            const name = leftNameInput.value.trim();
            if(!name || name === "Введите имя...") { alert("Сначала введи имя!"); return; }
            savedCharacters[name] = { avatar: currentAvatarSrc, subtitle: leftSubtitleInput.value };
            localStorage.setItem('ig_dm_characters_v1', JSON.stringify(savedCharacters));
            updateCharDropdown(); characterSelect.value = name; alert("Сохранено!");
        }

        function deleteCharacter() {
            const name = characterSelect.value;
            if(!name) return;
            if(confirm(`Удалить "${name}"?`)) {
                delete savedCharacters[name];
                localStorage.setItem('ig_dm_characters_v1', JSON.stringify(savedCharacters));
                updateCharDropdown(); characterSelect.value = "";
            }
        }
        updateCharDropdown();

        leftNameInput.addEventListener('input', () => document.getElementById('headerName').textContent = leftNameInput.value);
        leftSubtitleInput.addEventListener('input', () => document.getElementById('headerSubtitle').textContent = leftSubtitleInput.value);
        timeInput.addEventListener('input', () => iosTimeDisplay.textContent = timeInput.value);

        leftAvatarInput.addEventListener('input', function() { currentAvatarSrc = this.value; updateAllAvatars(); });
        document.getElementById('avatarUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) { currentAvatarSrc = event.target.result; leftAvatarInput.value = ''; updateAllAvatars(); }
                reader.readAsDataURL(file);
            }
        });

        function updateAllAvatars() {
            document.getElementById('headerAvatar').src = currentAvatarSrc;
            const avatars = document.querySelectorAll('.msg-avatar');
            avatars.forEach(img => img.src = currentAvatarSrc);
        }

        window.updateHeaderPos = function() {
            dynamicHeader.style.top = document.getElementById('headerPosY').value + 'px';
            dynamicHeader.style.left = document.getElementById('headerPosX').value + 'px';
        }
        window.updateTimePos = function() {
            iosTimeDisplay.style.top = document.getElementById('timePosY').value + 'px';
            iosTimeDisplay.style.left = document.getElementById('timePosX').value + 'px';
        }

        document.getElementById('storyUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) { 
                    currentStorySrc = event.target.result; storyPreview.src = currentStorySrc; storyPreview.style.display = 'block'; cancelStoryBtn.style.display = 'block'; cancelReply(); cancelAttachedImage();
                }
                reader.readAsDataURL(file);
            }
        });

        function cancelStory() { currentStorySrc = null; document.getElementById('storyUpload').value = ''; storyPreview.style.display = 'none'; cancelStoryBtn.style.display = 'none'; }

        document.getElementById('imageAttachUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentAttachedImageSrc = event.target.result; document.getElementById('attachedImagePreview').src = currentAttachedImageSrc; document.getElementById('attachedImagePreview').style.display = 'block'; document.getElementById('cancelAttachedImageBtn').style.display = 'block'; cancelStory(); 
                }
                reader.readAsDataURL(file);
            }
        });

        function cancelAttachedImage() { currentAttachedImageSrc = null; document.getElementById('imageAttachUpload').value = ''; document.getElementById('attachedImagePreview').style.display = 'none'; document.getElementById('cancelAttachedImageBtn').style.display = 'none'; }

        messagesBox.addEventListener('scroll', updateVisuals);
        document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

        // ФУНКЦИЯ ДОБАВЛЕНИЯ ПЛАШКИ ВРЕМЕНИ
        function addTimeDivider() {
            const val = document.getElementById('timeDividerInput').value.trim();
            if (!val) return;
            const div = document.createElement('div');
            div.className = 'time-divider';
            div.textContent = val;
            
            // Меню удаления по клику на саму плашку
            div.onclick = function(e) {
                e.stopPropagation();
                selectedMsgRow = this;
                const wrapperRect = phoneWrapper.getBoundingClientRect();
                let x = e.clientX - wrapperRect.left;
                let y = e.clientY - wrapperRect.top;
                if (x > 220) x -= 160; 
                contextMenu.style.display = 'block';
                contextMenu.style.left = x + 'px';
                contextMenu.style.top = y + 'px';
            };

            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
            document.getElementById('timeDividerInput').value = '';
            updateVisuals();
        }

        function createRowElement(sender, contentHtml) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message-row ${sender}`;
            
            msgDiv.onclick = function(e) {
                e.stopPropagation(); 
                selectedMsgRow = this;
                const wrapperRect = phoneWrapper.getBoundingClientRect();
                let x = e.clientX - wrapperRect.left; let y = e.clientY - wrapperRect.top;
                if (x > 220) x -= 160; 
                contextMenu.style.display = 'block'; contextMenu.style.left = x + 'px'; contextMenu.style.top = y + 'px';
            };
            
            let html = '';
            if (sender === 'left') { html += `<img class="msg-avatar" src="${currentAvatarSrc}" crossorigin="anonymous">`; }
            html += `<div class="msg-content">${contentHtml}</div>`;
            
            msgDiv.innerHTML = html;
            messagesBox.appendChild(msgDiv);
        }

        function addMessage() {
            const text = messageInput.value.trim().replace(/\n/g, '<br>');
            if (!text && !currentStorySrc && !currentAttachedImageSrc) return; 

            if (editingMsgNode) {
                if (editingMsgNode.tagName && editingMsgNode.tagName.toLowerCase() === 'img') return; 
                editingMsgNode.innerHTML = text; editingMsgNode = null;
                mainActionBtn.textContent = 'Добавить сообщение'; mainActionBtn.style.background = '#0095f6';
                messageInput.value = ''; updateVisuals(); return;
            }
            
            const sender = senderSelect.value;
            
            if (currentAttachedImageSrc) {
                let imgHtml = `<img src="${currentAttachedImageSrc}" class="msg msg-image-attachment" crossorigin="anonymous">`;
                createRowElement(sender, imgHtml);
            }

            if (text || currentStorySrc) {
                let html = '';
                if (currentStorySrc) {
                    const headerText = sender === 'right' ? 'Вы ответили на историю' : 'Ответил(-а) на вашу историю';
                    const alignSelf = sender === 'right' ? 'flex-end' : 'flex-start';
                    const flexDir = sender === 'right' ? 'row-reverse' : 'row';
                    html += `<div class="reply-header" style="align-self: ${alignSelf};">${headerText}</div>`;
                    html += `<div class="reply-wrapper" style="flex-direction: ${flexDir};">`;
                    html += `<div class="reply-line" style="background-color: #363636;"></div>`; 
                    html += `<img src="${currentStorySrc}" class="story-thumbnail" crossorigin="anonymous"></div>`;
                } 
                else if (replyingToText && !currentAttachedImageSrc) { 
                    const headerText = sender === 'right' ? 'Вы ответили' : 'Ответил(-а)';
                    const alignSelf = sender === 'right' ? 'flex-end' : 'flex-start';
                    const flexDir = sender === 'right' ? 'row-reverse' : 'row';
                    html += `<div class="reply-header" style="align-self: ${alignSelf};">${headerText}</div>`;
                    html += `<div class="reply-wrapper" style="flex-direction: ${flexDir};">`;
                    html += `<div class="reply-line"></div>`;
                    html += `<div class="reply-bubble"><div class="reply-bubble-text">${replyingToText}</div></div></div>`;
                }

                if (text) { html += `<div class="msg">${text}</div>`; }
                if (html !== '') { createRowElement(sender, html); }
            }

            messageInput.value = ''; messagesBox.scrollTop = messagesBox.scrollHeight;
            if (replyingToText) cancelReply(); if (currentStorySrc) cancelStory(); if (currentAttachedImageSrc) cancelAttachedImage();
            updateVisuals();
        }

        function handleReply() {
            if (!selectedMsgRow || selectedMsgRow.classList.contains('time-divider')) { contextMenu.style.display = 'none'; return; }
            contextMenu.style.display = 'none';
            const msgNode = selectedMsgRow.querySelector('.msg');
            if(!msgNode) return; 
            if (msgNode.tagName.toLowerCase() === 'img') { replyingToText = '📷 Фото'; } 
            else { replyingToText = msgNode.innerHTML.replace(/<br\s*[\/]?>/gi, ' '); }
            replyPreview.textContent = replyingToText; replyIndicator.style.display = 'block';
            cancelStory(); cancelAttachedImage();
        }

        function cancelReply() { replyingToText = null; replyIndicator.style.display = 'none'; }
        
        function handleEdit() {
            if (!selectedMsgRow || selectedMsgRow.classList.contains('time-divider')) { contextMenu.style.display = 'none'; return; }
            contextMenu.style.display = 'none'; cancelReply(); 
            editingMsgNode = selectedMsgRow.querySelector('.msg');
            if(!editingMsgNode) return;
            if (editingMsgNode.tagName.toLowerCase() === 'img') { alert('Картинки нельзя редактировать!'); editingMsgNode = null; return; }
            let currentText = editingMsgNode.innerHTML.replace(/<br\s*[\/]?>/gi, '\n');
            messageInput.value = currentText; mainActionBtn.textContent = '💾 Сохранить изменения'; mainActionBtn.style.background = '#4CAF50';
        }

        function handleDelete() {
            if (!selectedMsgRow) return;
            contextMenu.style.display = 'none';
            selectedMsgRow.remove();
            if (editingMsgNode && editingMsgNode === selectedMsgRow.querySelector('.msg')) {
                editingMsgNode = null; messageInput.value = ''; mainActionBtn.textContent = 'Добавить сообщение'; mainActionBtn.style.background = '#0095f6';
            }
            updateVisuals();
        }

        function clearChat() {
            if(confirm('Точно очистить весь чат?')) {
                messagesBox.innerHTML = ''; editingMsgNode = null; cancelReply(); cancelStory(); cancelAttachedImage();
                mainActionBtn.textContent = 'Добавить сообщение'; mainActionBtn.style.background = '#0095f6';
            }
        }

        function updateVisuals() {
            const msgs = Array.from(messagesBox.children);
            const phoneRect = phoneWrapper.getBoundingClientRect(); 
            
            msgs.forEach((row, i) => {
                if(row.classList.contains('time-divider')) return; // Пропускаем логику скругления для плашки

                const isRight = row.classList.contains('right');
                const msg = row.querySelector('.msg');
                const hasReply = row.querySelector('.reply-wrapper') !== null;
                const prev = msgs[i-1];
                const next = msgs[i+1];
                
                // Проверяем соседние сообщения, игнорируя плашки времени
                const prevSame = prev && prev.classList.contains(isRight ? 'right' : 'left');
                const nextSame = next && next.classList.contains(isRight ? 'right' : 'left');

                if(msg) {
                    msg.style.borderRadius = '20px';
                    if (isRight) {
                        if (prevSame && !hasReply) msg.style.borderTopRightRadius = '4px'; 
                        if (nextSame) msg.style.borderBottomRightRadius = '4px';
                    } else {
                        if (prevSame && !hasReply) msg.style.borderTopLeftRadius = '4px';
                        if (nextSame) msg.style.borderBottomLeftRadius = '4px';
                    }

                    if (isRight && msg.tagName.toLowerCase() !== 'img') {
                        msg.style.background = currentGradientBg;
                        msg.style.backgroundSize = `100% ${phoneRect.height}px`;
                        msg.style.backgroundRepeat = 'no-repeat';
                        const msgRect = msg.getBoundingClientRect();
                        const relativeTop = msgRect.top - phoneRect.top;
                        msg.style.backgroundPosition = `0px -${relativeTop}px`;
                    }
                }

                row.style.marginBottom = nextSame ? '2px' : '10px';
                const img = row.querySelector('.msg-avatar');
                if (img) img.style.visibility = nextSame ? 'hidden' : 'visible';
            });
        }

        function downloadChat() {
            contextMenu.style.display = 'none';
            phoneWrapper.style.borderRadius = '0'; phoneWrapper.style.border = 'none'; phoneWrapper.style.boxShadow = 'none';
            html2canvas(phoneWrapper, { scale: 3, useCORS: true, allowTaint: true, backgroundColor: '#0d1015', logging: false }).then(canvas => {
                phoneWrapper.style.borderRadius = '40px'; phoneWrapper.style.border = '1px solid #222'; phoneWrapper.style.boxShadow = '0 10px 40px rgba(0,0,0,0.6)';
                const link = document.createElement('a'); link.download = 'ig_chat.png'; link.href = canvas.toDataURL('image/png'); link.click();
            });
        }
    </script>
</body>
</html>
