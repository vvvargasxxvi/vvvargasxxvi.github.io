<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Group Chat Generator - Pro Mode Final</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'SF Pro Display';
            src: local('-apple-system'), local('BlinkMacSystemFont');
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #121212; display: flex; justify-content: center; gap: 20px; padding: 20px; height: 100vh; color: #fff;
        }

        .controls { 
            background: #1e1e1e; border-radius: 16px; padding: 20px; width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            display: flex; flex-direction: column; gap: 12px; height: fit-content; max-height: 95vh; overflow-y: auto; border: 1px solid #333;
        }
        .controls h3 { font-size: 18px; margin-bottom: 5px; text-align: center; color: #0095f6; }
        
        .control-section { background: #2a2a2a; border-radius: 8px; border: 1px solid #444; overflow: hidden; margin-bottom: 5px; }
        .control-section summary { padding: 12px; font-weight: 600; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; background: #333; }
        .section-content { padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }

        input, select, textarea { padding: 10px; border: 1px solid #444; background: #1e1e1e; color: #fff; border-radius: 8px; font-size: 14px; outline: none; width: 100%; }
        button { background: #0095f6; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        
        .reply-indicator { display: none; background: #262626; padding: 10px; border-radius: 8px; font-size: 12px; border-left: 3px solid #0095f6; color: #a8a8a8; margin-bottom: 5px; }
        .reply-indicator-text { color: #fff; font-style: italic; display: block; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .cancel-btn { background: none !important; color: #ff4d4d !important; padding: 0 !important; float: right; width: auto !important; font-weight: bold;}

        .phone-wrapper { width: 390px; height: 844px; background: #0d1015; border-radius: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #222; position: relative; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: transparent; min-height: 0; }
        .top-bar-container { width: 100%; position: relative; background: #0d1015; flex-shrink: 0; }
        .top-bar-container img { width: 100%; display: block; }

        .dynamic-header { position: absolute; top: 57px; left: 45px; display: flex; align-items: center; gap: 10px; z-index: 10; }
        .group-avatars-container { position: relative; width: 42px; height: 42px; flex-shrink: 0; }
        .group-avatars-container img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid #0d1015; position: absolute; }
        .group-avatars-container .av-top { top: 0; left: 0; z-index: 2; }
        .group-avatars-container .av-bottom { bottom: 0; right: 0; z-index: 1; }

        .header-info { display: flex; flex-direction: column; }
        .header-info .name { font-weight: 600; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 4px; }
        #iosTimeDisplay { position: absolute; top: 14px; left: 32px; font-weight: 600; font-size: 16px; letter-spacing: -0.3px; color: #fff; z-index: 20; }

        .messages { flex: 1; padding: 16px; display: flex; flex-direction: column; overflow-y: auto; background: #0d1015; min-height: 0; position: relative; }
        .messages::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; cursor: pointer; position: relative; z-index: 2; margin-bottom: 10px; }
        .message-row.left { align-self: flex-start; }
        .message-row.right { align-self: flex-end; }
        
        .msg-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; max-width: 100%; min-width: 0; }
        .message-row.left .msg-content { align-items: flex-start; }
        .message-row.right .msg-content { align-items: flex-end; }

        .reply-header { font-size: 11px; color: #8e8e8e; margin-bottom: 4px; padding: 0 4px; }
        .message-row.left .reply-header { margin-left: 9px; } 
        .reply-wrapper { display: flex; gap: 6px; margin-bottom: 6px; max-width: 100%; }
        .reply-line { width: 3px; background-color: #23282F; border-radius: 3px; flex-shrink: 0; }
        .reply-bubble { background: #23282F; padding: 10px 12px; border-radius: 18px; flex: 1; min-width: 0; }
        .reply-bubble-text { font-size: 13px; color: #e0e0e0; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; word-break: break-word; }

        .msg { padding: 9px 13px; border-radius: 20px; font-size: 15px; line-height: 1.35; overflow-wrap: break-word; word-break: break-word; width: fit-content; max-width: 100%; display: inline-block; }
        font-weight: 200; 
            letter-spacing: -0.01em; 
            -webkit-font-smoothing: antialiased; /* Сделает шрифт еще чище на Mac/iOS */
        }
        .message-row.left .msg { background: #25282d !important; color: #fff; }
        .message-row.right .msg { color: white; }
        .time-divider { text-align: center; color: #8e8e8e; font-size: 11px; font-weight: 500; margin: 24px 0 16px 0; width: 100%; text-transform: uppercase; letter-spacing: 0.2px; align-self: center; cursor: pointer; }

        .msg-image-attachment { max-width: 170px; border-radius: 20px; display: block; border: 1px solid #222; object-fit: cover; }
        .bottom-bar-container { width: 100%; background: #0d1015; flex-shrink: 0; }
        .bottom-bar-container img { width: 100%; display: block; }

        .context-menu { position: absolute; background: #262626; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; border: 1px solid #363636; width: 160px; display: none; }
        .menu-item { padding: 12px 16px; font-size: 15px; color: #fff; cursor: pointer; border-bottom: 1px solid #363636; }
        .menu-item-danger { color: #ed4956; border-bottom: none; }
        
        /* СТИЛИ ДЛЯ БОКОВОГО МЕНЮ */
        .sidebar { 
            background: #1e1e1e; 
            border-radius: 16px; 
            padding: 20px; 
            width: 220px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 1px solid #333;
            height: fit-content;
        }
        .sidebar-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }
        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }
        .nav-item:hover { 
            background: #2a2a2a; 
            border-color: #444;
        }
        .nav-item.active { 
            background: #0095f6; 
            color: #fff; 
            border-color: #0095f6;
            box-shadow: 0 4px 10px rgba(0, 149, 246, 0.3);
        }
    </style>
</head>
<body>
<div class="sidebar">
        <div class="sidebar-title">Выбор режима</div>
        <a href="index.html" class="nav-item">👤 Личный (1 на 1)</a>
        <!-- Класс active теперь тут 👇 -->
        <a href="group.html" class="nav-item active">👥 Групповой чат</a>
    </div>
    <div class="controls">
        <h3>Групповой чат (Final)</h3>

        <details class="control-section" open>
            <summary>👥 Настройки группы</summary>
            <div class="section-content">
                <input type="text" id="groupName" placeholder="Название группы" value="ginevra.w_p, ᛟ" oninput="updateHeader()">
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="avTop" placeholder="Ава сверху" value="https://i.pravatar.cc/150?img=35" oninput="updateHeader()">
                    <input type="text" id="avBottom" placeholder="Ава снизу" value="https://i.pravatar.cc/150?img=68" oninput="updateHeader()">
                </div>
                <input type="text" id="timeHeader" value="14:38" oninput="updateTimeHeader()">
            </div>
        </details>

        <details class="control-section">
            <summary>📎 Медиа</summary>
            <div class="section-content">
                <strong>Ответ на историю:</strong>
                <input type="file" onchange="previewMedia(this, 'story')">
                <strong>Картинка в чат:</strong>
                <input type="file" onchange="previewMedia(this, 'chatImg')">
            </div>
        </details>

        <hr style="border: 0; border-top: 1px solid #444;">

        <div style="display: flex; gap: 10px;">
            <input type="text" id="timeDividerInput" placeholder="ВЧЕРА В 17:17" style="flex: 2;">
            <button onclick="addTimeDivider()" style="flex: 1; background: #333; font-size: 12px;">⏳ Плашка</button>
        </div>

        <div id="replyIndicator" class="reply-indicator">
            <button class="cancel-btn" onclick="cancelReply()">✕</button>
            Отвечаем на: <span id="replyPreview" class="reply-indicator-text"></span>
        </div>

        <textarea id="messageInput" placeholder="Текст сообщения..." rows="3" style="font-family: inherit; resize: none;"></textarea>
        
        <select id="senderSelect"></select>
        
        <button id="mainActionBtn" onclick="addMessage()" style="margin-top: 5px;">Отправить</button>
        
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <button onclick="clearChat()" style="background: #333; flex: 1; font-size: 13px;">Очистить</button>
            <button onclick="downloadChat()" style="background: #fff; color: #000; flex: 2; font-size: 13px;">📸 Скачать</button>
        </div>
        <button onclick="updateSenderList()" style="background: #222; font-size: 11px; margin-top: 5px;">🔄 Обновить список участников</button>
    </div>

    <div class="phone-wrapper" id="captureArea">
        <div id="contextMenu" class="context-menu">
            <div class="menu-item" onclick="handleReply()">Ответить</div>
            <div class="menu-item" onclick="handleEdit()">Изменить</div>
            <div class="menu-item menu-item-danger" onclick="handleDelete()">Удалить</div>
        </div>

        <div class="chat-container">
            <div class="top-bar-container">
                <img src="https://i.postimg.cc/CLHkRs4K/верхний_бар.png" crossorigin="anonymous">
                <div id="iosTimeDisplay">14:38</div>
                <div class="dynamic-header">
                    <div class="group-avatars-container">
                        <img id="headerAvTop" class="av-top" src="">
                        <img id="headerAvBottom" class="av-bottom" src="">
                    </div>
                    <div class="header-info"><div class="name"><span id="headerGroupName"></span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8A8A8" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div></div>
                </div>
            </div>
            <div class="messages" id="messagesBox"></div>
            <div class="bottom-bar-container"><img src="https://i.postimg.cc/SK5zBTm1/нижний_бар.png" crossorigin="anonymous"></div>
        </div>
    </div>

    <script>
        const messagesBox = document.getElementById('messagesBox');
        const messageInput = document.getElementById('messageInput');
        const contextMenu = document.getElementById('contextMenu');
        const senderSelect = document.getElementById('senderSelect');
        const mainActionBtn = document.getElementById('mainActionBtn');
        const phoneWrapper = document.getElementById('captureArea');
        
        let savedChars = JSON.parse(localStorage.getItem('ig_dm_characters_v1')) || {};
        let replyingToText = null; let storyData = null; let chatImgData = null;
        let selectedMsgRow = null;
        let editingMsgNode = null; 

        function updateHeader() {
            document.getElementById('headerGroupName').textContent = document.getElementById('groupName').value;
            document.getElementById('headerAvTop').src = document.getElementById('avTop').value;
            document.getElementById('headerAvBottom').src = document.getElementById('avBottom').value;
        }

        function updateTimeHeader() { document.getElementById('iosTimeDisplay').textContent = document.getElementById('timeHeader').value; }

        function updateSenderList() {
            senderSelect.innerHTML = '<option value="right|Me">Я (Градиент)</option>';
            savedChars = JSON.parse(localStorage.getItem('ig_dm_characters_v1')) || {};
            for (let name in savedChars) { senderSelect.add(new Option(`От лица: ${name}`, `left|${name}`)); }
        }

        function previewMedia(input, type) {
            const reader = new FileReader();
            reader.onload = (e) => { if (type === 'story') { storyData = e.target.result; } else { chatImgData = e.target.result; } };
            if (input.files[0]) reader.readAsDataURL(input.files[0]);
        }

        function addMessage() {
            const text = messageInput.value.trim().replace(/\n/g, '<br>');
            
            if (editingMsgNode) {
                if (editingMsgNode.tagName && editingMsgNode.tagName.toLowerCase() === 'img') return; 
                editingMsgNode.innerHTML = text; 
                editingMsgNode = null;
                mainActionBtn.textContent = 'Отправить'; 
                mainActionBtn.style.background = '#0095f6';
                messageInput.value = ''; 
                updateVisuals(); 
                return;
            }

            const [side, charName] = senderSelect.value.split('|');
            if (!text && !chatImgData) return;

            const isRight = side === 'right';
            const avatarUrl = isRight ? "" : (savedChars[charName]?.avatar || "");

            const row = document.createElement('div');
            row.className = `message-row ${isRight ? 'right' : 'left'}`;
            row.setAttribute('data-sender', charName); 
            
            row.onclick = function(e) {
                e.stopPropagation(); selectedMsgRow = this;
                const wrapperRect = phoneWrapper.getBoundingClientRect();
                let x = e.clientX - wrapperRect.left;
                let y = e.clientY - wrapperRect.top;
                if (x > 220) x -= 160; 
                contextMenu.style.display = 'block';
                contextMenu.style.left = x + 'px';
                contextMenu.style.top = y + 'px';
            };

            let html = !isRight ? `<img class="msg-avatar" src="${avatarUrl}">` : '';
            html += `<div class="msg-content">`;
            if (storyData) {
                html += `<div class="reply-header">${isRight?'Вы ответили на историю':'Ответил(-а) на историю'}</div>`;
                html += `<div class="reply-wrapper"><div class="reply-line"></div><img src="${storyData}" class="story-thumbnail"></div>`;
            } else if (replyingToText) {
                html += `<div class="reply-header">${isRight?'Вы ответили':'Ответил(-а)'}</div>`;
                html += `<div class="reply-wrapper"><div class="reply-line"></div><div class="reply-bubble"><div class="reply-bubble-text">${replyingToText}</div></div></div>`;
            }
            if (chatImgData) html += `<img src="${chatImgData}" class="msg-image-attachment">`;
            if (text) html += `<div class="msg">${text}</div>`;
            html += `</div>`;
            
            row.innerHTML = html;
            messagesBox.appendChild(row);

            messageInput.value = ''; cancelReply();
            storyData = null; chatImgData = null;
            updateVisuals(); 
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function addTimeDivider() {
            const val = document.getElementById('timeDividerInput').value.trim();
            if (!val) return;
            const div = document.createElement('div');
            div.className = 'time-divider';
            div.textContent = val;
            
            div.onclick = function(e) { 
                e.stopPropagation(); selectedMsgRow = this; 
                const wrapperRect = phoneWrapper.getBoundingClientRect();
                let x = e.clientX - wrapperRect.left; let y = e.clientY - wrapperRect.top;
                if (x > 220) x -= 160; 
                contextMenu.style.display = 'block'; contextMenu.style.left = x + 'px'; contextMenu.style.top = y + 'px';
            };
            
            messagesBox.appendChild(div);
            document.getElementById('timeDividerInput').value = '';
        }

        function handleReply() {
            if (!selectedMsgRow || selectedMsgRow.classList.contains('time-divider')) { contextMenu.style.display = 'none'; return; }
            const msgNode = selectedMsgRow.querySelector('.msg');
            replyingToText = msgNode ? msgNode.innerHTML.replace(/<br>/g, ' ') : '📷 Фото';
            document.getElementById('replyPreview').textContent = replyingToText;
            document.getElementById('replyIndicator').style.display = 'block';
            contextMenu.style.display = 'none';
        }

        function handleEdit() {
            if (!selectedMsgRow || selectedMsgRow.classList.contains('time-divider')) { contextMenu.style.display = 'none'; return; }
            contextMenu.style.display = 'none'; cancelReply(); 
            editingMsgNode = selectedMsgRow.querySelector('.msg');
            if(!editingMsgNode) return;
            if (editingMsgNode.tagName.toLowerCase() === 'img') { alert('Картинки нельзя редактировать!'); editingMsgNode = null; return; }
            let currentText = editingMsgNode.innerHTML.replace(/<br\s*[\/]?>/gi, '\n');
            messageInput.value = currentText; 
            mainActionBtn.textContent = '💾 Сохранить изменения'; 
            mainActionBtn.style.background = '#4CAF50';
        }

        function cancelReply() { replyingToText = null; document.getElementById('replyIndicator').style.display = 'none'; }
        
        function handleDelete() { 
            if (!selectedMsgRow) return;
            contextMenu.style.display = 'none';
            selectedMsgRow.remove();
            if (editingMsgNode && editingMsgNode === selectedMsgRow.querySelector('.msg')) {
                editingMsgNode = null; messageInput.value = ''; 
                mainActionBtn.textContent = 'Отправить'; mainActionBtn.style.background = '#0095f6';
            }
            updateVisuals(); 
        }
        
        function clearChat() { if(confirm('Очистить?')) messagesBox.innerHTML = ''; }

        function updateVisuals() {
            const msgs = Array.from(messagesBox.children);
            const phoneRect = document.getElementById('captureArea').getBoundingClientRect();
            
            msgs.forEach((row, i) => {
                if (row.classList.contains('time-divider')) return;
                
                const msg = row.querySelector('.msg');
                const sender = row.getAttribute('data-sender');
                const side = row.classList.contains('right') ? 'right' : 'left';
                
                const next = msgs[i+1];
                const isNextSameAuthor = next && !next.classList.contains('time-divider') && next.getAttribute('data-sender') === sender;
                const hasReply = row.querySelector('.reply-wrapper') !== null;

                if (msg) {
                    msg.style.borderRadius = '20px';
                    if (side === 'right') {
                        if (row.previousElementSibling?.getAttribute('data-sender') === sender && !hasReply) msg.style.borderTopRightRadius = '4px';
                        if (isNextSameAuthor) msg.style.borderBottomRightRadius = '4px';
                        
                        // ФИКС ГРАДИЕНТА
                        msg.style.backgroundImage = "url('https://i.postimg.cc/T1nmqVM4/фон-градиент.png')";
                        msg.style.backgroundSize = `100% ${phoneRect.height}px`;
                        msg.style.backgroundRepeat = 'no-repeat';
                        const rect = msg.getBoundingClientRect();
                        msg.style.backgroundPosition = `0px -${rect.top - phoneRect.top}px`;
                    } else {
                        if (row.previousElementSibling?.getAttribute('data-sender') === sender && !hasReply) msg.style.borderTopLeftRadius = '4px';
                        if (isNextSameAuthor) msg.style.borderBottomLeftRadius = '4px';
                    }
                }

                row.style.marginBottom = isNextSameAuthor ? '2px' : '10px';
                const avatar = row.querySelector('.msg-avatar');
                if (avatar) avatar.style.visibility = isNextSameAuthor ? 'hidden' : 'visible';
            });
        }

        function downloadChat() {
            contextMenu.style.display = 'none';
            html2canvas(document.getElementById('captureArea'), { scale: 3, useCORS: true, backgroundColor: '#0d1015' }).then(canvas => {
                const link = document.createElement('a'); link.download = 'ig_group_chat.png'; link.href = canvas.toDataURL(); link.click();
            });
        }

        // ОБРАБОТЧИК СКРОЛЛА - ВАЖНО ДЛЯ ГРАДИЕНТА
        messagesBox.addEventListener('scroll', updateVisuals);

        updateHeader(); updateTimeHeader(); updateSenderList();
        document.addEventListener('click', () => { contextMenu.style.display = 'none'; });
    </script>
</body>
</html>
