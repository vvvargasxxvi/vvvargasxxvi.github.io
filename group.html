<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Instagram Group Chat Generator - Pro Mode Final</title>
    <link rel="stylesheet" href="style.css?v=151">
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script src="export.js?v=151" defer></script>
    <script src="library.js?v=151" defer></script>
    <script src="scene_group.js?v=152" defer></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-title">Выбор режима</div>
        <a href="index.html" class="nav-item">👤 Личный (1 на 1)</a>
        <a href="group.html" class="nav-item active">👥 Групповой чат</a>
        <a href="story.html" class="nav-item">📸 Истории</a>
    </div>

    <div class="mobile-tabs">
        <button type="button" id="tabControls" class="active" onclick="toggleMobileTab('controls')">⚙️ Настройки</button>
        <button type="button" id="tabPreview" onclick="toggleMobileTab('preview')">📱 Превью</button>
    </div>

    <div class="controls-container">
        <div class="controls">
            <h3 class="group-title">Групповой чат (Final)</h3>

            <div class="settings-section" style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #232830;">
                <h4 style="margin-top: 0; margin-bottom: 8px; color: #f0f3f5;">Библиотека групп 📦</h4>
                <select id="groupLibrarySelect" style="width: 100%; padding: 8px; background: #1a1f26; color: #fff; border: 1px solid #3a3f47; border-radius: 6px; margin-bottom: 8px; cursor: pointer;">
                    <option value="">-- Выберите группу --</option>
                </select>
                <div style="display: flex; gap: 8px;">
                    <button type="button" id="saveGroupBtn" style="flex: 1; padding: 6px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Сохранить текущую</button>
                    <button type="button" id="deleteGroupBtn" style="flex: 1; padding: 6px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Удалить</button>
                </div>
            </div>

            <details class="control-section">
                <summary>👥 Настройки группы</summary>
                <div class="section-content">
                    <input type="text" id="groupName" placeholder="Название группы" value="ginevra.w_p, ᛟ" oninput="updateHeader()">
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="avTop" placeholder="Ава сверху" value="https://i.pravatar.cc/150?img=35" oninput="updateHeader()">
                        <input type="text" id="avBottom" placeholder="Ава снизу" value="https://i.pravatar.cc/150?img=68" oninput="updateHeader()">
                    </div>
                    <input type="text" id="timeHeader" value="14:38" oninput="updateTimeHeader()">
                </div>
            </details>

            <details class="control-section">
                <summary>💾 Сохранение / Загрузка чата</summary>
                <div class="section-content">
                    <button type="button" onclick="exportChat()" style="background: #333; font-size: 13px;">📥 Сохранить этот чат (JSON)</button>
                    <input type="file" id="importChatInput" accept=".json" style="display: none;" onchange="importChat(event)">
                    <button type="button" onclick="document.getElementById('importChatInput').click()" style="background: #333; font-size: 13px;">📤 Загрузить чат из файла</button>
                </div>
            </details>

            <details class="control-section">
                <summary>📎 Медиа</summary>
                <div class="section-content">
                    <strong>Ответ на историю:</strong>
                    <input type="file" onchange="previewMedia(this, 'story')">
                    <strong>Картинка в чат:</strong>
                    <input type="file" onchange="previewMedia(this, 'chatImg')">
                </div>
            </details>

            <hr style="border: 0; border-top: 1px solid #444;">

            <div style="display: flex; gap: 10px;">
                <input type="text" id="timeDividerInput" placeholder="ВЧЕРА В 17:17" style="flex: 2;">
                <button type="button" onclick="addTimeDivider()" style="flex: 1; background: #333; font-size: 12px;">⏳ Плашка</button>
            </div>

            <div id="replyIndicator" class="reply-indicator">
                <button type="button" class="cancel-btn" onclick="cancelReply()">✕</button>
                Отвечаем на: <span id="replyPreview" class="reply-indicator-text"></span>
            </div>

            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
                <label style="font-size: 13px; display: flex; align-items: center; gap: 6px; color: #aaa; cursor: pointer;">
                    <input type="checkbox" id="isForwardedCheckbox" style="width: auto; margin: 0; cursor: pointer;"> Пересланное
                </label>
                <label style="font-size: 13px; display: flex; align-items: center; gap: 6px; color: #aaa; cursor: pointer;">
                    <input type="checkbox" id="isSeenCheckbox" style="width: auto; margin: 0; cursor: pointer;" onchange="document.getElementById('seenTextInput').style.display = this.checked ? 'block' : 'none'"> Просмотрено
                </label>
                <input type="text" id="seenTextInput" placeholder="Напр: 5 ч. назад" style="display: none; flex: 1; padding: 4px 8px; font-size: 12px; height: 26px;">
            </div>

            <textarea id="messageInput" placeholder="Текст сообщения..." rows="3" style="font-family: inherit; resize: none;"></textarea>
            
            <select id="senderSelect"></select>
            
            <button type="button" id="mainActionBtn" onclick="addMessage()" style="margin-top: 5px;">Отправить</button>
            
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button type="button" onclick="clearChat()" style="background: #333; flex: 1; font-size: 13px;">Очистить</button>
                <button type="button" onclick="downloadChat(event)" style="background: #fff; color: #000; flex: 1.5; font-size: 13px;">📸 Скачать скриншот</button>
                <button type="button" id="zipBtn" onclick="downloadChatAsZip('group')" style="background: #4CAF50; color: #fff; flex: 1.5; font-size: 13px;">📦 Нарезка (ZIP)</button>
            </div>
            <button type="button" onclick="updateSenderList()" style="background: #222; font-size: 11px; margin-top: 5px;">🔄 Обновить список участников</button>
        </div>
    </div>

    <div class="phone-container">
        <div class="phone-wrapper" id="captureArea">
            <div id="contextMenu" class="context-menu">
                <div class="menu-item" onclick="handleReply()">Ответить</div>
                <div class="menu-item" onclick="handleEdit()">Изменить</div>
                <div class="menu-item menu-item-danger" onclick="handleDelete()">Удалить</div>
            </div>

            <div class="chat-container">
                <div class="top-bar-container">
                    <img src="https://i.postimg.cc/CLHkRs4K/верхний_бар.png" crossorigin="anonymous">
                    <div id="iosTimeDisplay">14:38</div>
                    <div class="dynamic-header">
                        <div class="group-avatars-container">
                            <img id="headerAvTop" class="av-top" src="" crossorigin="anonymous">
                            <img id="headerAvBottom" class="av-bottom" src="" crossorigin="anonymous">
                        </div>
                        <div class="header-info"><div class="name"><span id="headerGroupName"></span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8A8A8" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div></div>
                    </div>
                </div>
                <div class="messages" id="messagesBox"></div>
                <div class="bottom-bar-container"><img src="https://i.postimg.cc/SK5zBTm1/нижний_бар.png" crossorigin="anonymous"></div>
            </div>
        </div>
    </div>
</body>
</html>
